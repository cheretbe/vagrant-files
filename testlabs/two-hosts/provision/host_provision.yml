---
- name: Host provision
  hosts: all

  tasks:
    - name: Print host information
      debug:
        msg: '{{ ansible_facts["fqdn"] }}: {{ ansible_facts["distribution"] }} {{ ansible_facts["distribution_version"] }}'

    - name: Generate /etc/hosts
      ansible.builtin.copy:
        dest: /etc/hosts
        content: |
          # Generated by Ansible at {{ lookup('pipe', 'hostname -f') }}
          # Any local changes will be overwritten

          127.0.0.1  localhost
          127.0.1.1  {{ inventory_hostname }}.local.test {{ inventory_hostname }}

          {% for entry in etc_hosts_entries | default([]) %}
          {{ entry.ip }}  {{ entry.value }}
          {% endfor %}
      become: true
